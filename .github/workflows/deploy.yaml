name: deploy-union
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v2
      
      - name: Setup Node.js
        uses: actions/setup-node@v1
        with:
          node-version: "18"
          
      - name: Build Frontend
        run: |
          npm install
          npm run build

      - name: Copy Build Files to Server Directory
        run: |
          mkdir -p server
          cp -r dist/* server/

      - name: Print Current Directory
        run: |
          pwd
          ls -al

      - name: Print GitHub Token
        run: echo ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Repository Access
        run: |
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/Shahab987/phonegon-union

      - name: Commit and Push to New Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} #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
          TARGET_REPO: Shahab987/phonegon-union  # Your target repo
          TARGET_BRANCH: main  # Your target branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git clone --single-branch --branch $TARGET_BRANCH https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git output-repo
          cp -r server/* output-repo/
          cd output-repo
          git add .
          git commit -m "Update built files"
          git push origin $TARGET_BRANCH
