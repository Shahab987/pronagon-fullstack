name: deploy-union
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v2
      
      - name: Setup Node.js
        uses: actions/setup-node@v1
        with:
          node-version: "18"
          
      - name: Build Frontend
        run: |
          npm install
          npm run build

      - name: Copy Build Files to Server Directory
        run: |
          mkdir -p server
          cp -r dist/* server/

      - name: Initial Commit and Push to New Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: Shahab987/phonegon-union
          TARGET_BRANCH: main
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git init
          git add .
          git commit -m "Initial commit"
          git branch -M $TARGET_BRANCH
          git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git
          git push -u origin $TARGET_BRANCH
